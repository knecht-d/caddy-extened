name: Publish

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caddy-extended-publish
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=docker.io/knechtd/caddy-extended,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/knecht-d/caddy-extened
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: Save digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Read Caddy version
        id: version
        run: |
          version=$(sed -n 's/^ARG CADDY_VERSION=//p' Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/knechtd/caddy-extended
          flavor: latest=false
          tags: |
            type=raw,value=stable
            type=raw,value=latest
            type=raw,value=caddy-${{ steps.version.outputs.version }}
            type=sha
      - name: Publish multi-platform manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find "$RUNNER_TEMP/digests" -maxdepth 1 -type f | sort)
          test "${#files[@]}" -eq 2
          args=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then args+=(-t "$tag"); fi
          done <<< "$TAGS"
          test "${#args[@]}" -gt 0
          sources=()
          for file in "${files[@]}"; do
            sources+=("docker.io/knechtd/caddy-extended@sha256:$(basename "$file")")
          done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
      - name: Verify published platforms
        run: |
          docker buildx imagetools inspect docker.io/knechtd/caddy-extended:stable
